# Конфигурация статических анализаторов проекта.

[flake8]
max-line-length = 100
# Каталоги сборки и виртуальных окружений в анализ не попадают.
exclude = .git,__pycache__,build,dist,.venv,venv
# E203 конфликтует с форматированием black, W503 устарел в пользу W504.
extend-ignore = E203,W503

[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True
